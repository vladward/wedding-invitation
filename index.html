<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vlad & Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

        Поэтому не представляем наш праздник без Вашего участия!
    </span>
        <span class="moment__description">
        Разделите с нами главное событие лета - подарите нам своё внимание и поддержку.
    </span>
        <div class="moment__separation">
            <div class="line"></div>
            <div class="separator"></div>
            <div class="line"></div>
        </div>
    </div>
</div>
